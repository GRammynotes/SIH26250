<rect class="ac" x="398" y="278" width="4" height="36"/>
<ellipse cx="400" cy="100" rx="3.5" ry="11" fill="none" stroke="#00d4ff" stroke-opacity=".5"/>

<!-- leader lines -->
<path class="ll" d="M249,280H218M288,262L218,243M371,232L218,187M551,280H582M512,262L582,243M429,232L582,187"/>

<!-- hardpoints: loaded -->
