<text class="am" x="36" y="408">MICA RF</text><text class="rw" x="250" y="408">2</text><text class="rw" x="330" y="408">02 · 08</text><text class="rw" x="560" y="408">112 kg</text><text class="rw" x="660" y="408">224 kg</text>
<text class="am" x="36" y="424">Spice-2000</text><text class="rw" x="250" y="424">1</text><text class="rw" x="330" y="424">03</text><text class="rw" x="560" y="424">1,000 kg</text><text class="rw" x="660" y="424">1,000 kg</text>
<text class="am" x="36" y="440">Spice-1000</text><text class="rw" x="250" y="440">1</text><text class="rw" x="330" y="440">07</text><text class="rw" x="560" y="440">500 kg</text><text class="rw" x="660" y="440">500 kg</text>
<text class="am" x="36" y="459">TOTAL PAYLOAD · 1,948 kg · 6 / 9 STATIONS</text>
