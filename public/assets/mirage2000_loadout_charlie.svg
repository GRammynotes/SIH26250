<text class="lb" x="192" y="297">MICA IR</text><text class="st" x="192" y="307">ST01</text>
<text class="lb" x="192" y="252">MICA RF</text><text class="st" x="192" y="262">ST02</text>
<text class="lb" x="192" y="207">Spice-2000</text><text class="st" x="192" y="217">ST03</text>
</g>
