<text class="lb" x="608" y="297">MICA IR</text><text class="st" x="608" y="307">ST09</text>
<text class="lb" x="608" y="252">MICA RF</text><text class="st" x="608" y="262">ST08</text>
<text class="lb" x="608" y="207">Spice-1000</text><text class="st" x="608" y="217">ST07</text>
</g>

