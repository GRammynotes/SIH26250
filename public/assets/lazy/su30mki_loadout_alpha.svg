    <path d="M400 55L404 62L409 82L412 108L414 120L452 136L452 143L418 152L424 160L436 172L590 232L600 238L598 262L472 286L466 292L460 300L508 312L508 326L456 334L416 334L416 320L405 320L405 348L400 352L395 348L395 320L384 320L384 334L344 334L292 326L292 312L340 300L334 292L328 286L202 262L200 238L210 232L364 172L376 160L382 152L348 143L348 136L386 120L388 108L391 82L396 62Z"
