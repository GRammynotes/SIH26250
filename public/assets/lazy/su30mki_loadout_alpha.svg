  <rect x="36" y="469" width="299" height="5" fill="#ffb000"/>
  <text x="36" y="484" font-size="7" fill="#00d4ff" fill-opacity="0.6">ILLUSTRATIVE LOADOUT · APPROX. WEIGHTS</text>
  <text x="764" y="484" font-size="7" text-anchor="end" fill="#00d4ff" fill-opacity="0.6">MAX 8,000 KG</text>
