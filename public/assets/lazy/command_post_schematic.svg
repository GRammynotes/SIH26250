<svg viewBox="0 0 1200 700" xmlns="http://www.w3.org/2000/svg" font-family="ui-monospace, Menlo, Consolas, 'Courier New', monospace">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#22d3ee" stroke-opacity="0.06" stroke-width="1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 1L9 5L0 9Z" fill="#22d3ee"/>
    </marker>
  </defs>

  <!-- Background -->
  <rect width="1200" height="700" fill="#05080f"/>

  <!-- Secure enclave (room) -->
  <rect x="30" y="80" width="1140" height="520" fill="url(#grid)" stroke="#22d3ee" stroke-width="1" stroke-dasharray="8 5"/>
  <text x="46" y="588" font-size="10" fill="#22d3ee" letter-spacing="1.5">SECURE ENCLAVE · AIR-GAPPED</text>

  <!-- External feeds -->
  <g fill="#05080f" stroke="#22d3ee" stroke-width="1">
    <rect x="55" y="14" width="150" height="32"/>
    <rect x="225" y="14" width="150" height="32"/>
    <rect x="525" y="14" width="150" height="32"/>
    <rect x="795" y="14" width="150" height="32"/>
  </g>
  <g font-size="10" fill="#22d3ee" text-anchor="middle">
    <text x="130" y="34">IACCS FEED</text>
    <text x="300" y="34">SATELLITE INTEL</text>
    <text x="600" y="34">AWACS LINK</text>
    <text x="870" y="34">IMMOLS LOGISTICS</text>
  </g>

  <!-- Feed arrows -->
  <g stroke="#22d3ee" stroke-width="1" stroke-dasharray="4 3" fill="none" marker-end="url(#arrow)">
    <path d="M130 46V166"/>
    <path d="M300 46V166"/>
    <path d="M600 46V104"/>
    <path d="M870 46V166"/>
  </g>

  <!-- ===== LEFT: INTELLIGENCE FUSION ===== -->
  <text x="225" y="150" font-size="10" fill="#22d3ee" text-anchor="middle" letter-spacing="1">INTELLIGENCE FUSION</text>
  <g fill="none" stroke="#22d3ee" stroke-width="1">
    <rect x="70" y="200" width="310" height="60"/>
    <circle cx="125" cy="285" r="10"/>
    <circle cx="225" cy="285" r="10"/>
    <circle cx="325" cy="285" r="10"/>
  </g>
  <g fill="#22d3ee" fill-opacity="0.25" stroke="#22d3ee" stroke-width="1">
    <rect x="80" y="172" width="80" height="12"/>
    <rect x="185" y="172" width="80" height="12"/>
    <rect x="290" y="172" width="80" height="12"/>
  </g>
  <text x="225" y="322" font-size="9" fill="#22d3ee" fill-opacity="0.7" text-anchor="middle">ISR FUSION · TRACK CORRELATION</text>

  <!-- ===== CENTER: AIR COMMANDER + WALL DISPLAY ===== -->
  <rect x="480" y="105" width="240" height="22" fill="#22d3ee" fill-opacity="0.25" stroke="#22d3ee" stroke-width="1"/>
  <text x="490" y="120" font-size="9" fill="#22d3ee">COMMON OPERATING PICTURE</text>
  <!-- map icon -->
  <g fill="none" stroke="#22d3ee" stroke-width="1">
    <path d="M672 110L681 113L690 110L699 113V124L690 121L681 124L672 121Z"/>
    <path d="M681 113V124M690 110V121"/>
  </g>

  <!-- commander -> wall display -->
  <path d="M600 300V129" stroke="#22d3ee" stroke-width="1" stroke-dasharray="4 3" fill="none" marker-end="url(#arrow)"/>

  <rect x="520" y="173" width="160" height="28" fill="#05080f"/>
  <text x="600" y="185" font-size="10" fill="#22d3ee" text-anchor="middle" letter-spacing="1">AIR COMMANDER</text>
  <text x="600" y="197" font-size="9" fill="#22d3ee" fill-opacity="0.7" text-anchor="middle">AIR COMMAND CONSOLE</text>

  <g fill="none" stroke="#22d3ee" stroke-width="1">
    <rect x="520" y="300" width="160" height="50"/>
    <circle cx="600" cy="380" r="14"/>
    <circle cx="490" cy="330" r="9"/>
    <circle cx="710" cy="330" r="9"/>
  </g>
  <rect x="545" y="305" width="110" height="10" fill="#22d3ee" fill-opacity="0.25" stroke="#22d3ee" stroke-width="1"/>
  <text x="600" y="425" font-size="9" fill="#22d3ee" fill-opacity="0.7" text-anchor="middle">COMMAND · DECISION AUTHORITY</text>

  <!-- ===== RIGHT: TASKING & WEAPONEERING ===== -->
  <text x="975" y="150" font-size="10" fill="#22d3ee" text-anchor="middle" letter-spacing="1">TASKING &amp; WEAPONEERING</text>
  <g fill="none" stroke="#22d3ee" stroke-width="1">
    <rect x="830" y="200" width="290" height="60"/>
    <circle cx="905" cy="285" r="10"/>
    <circle cx="1045" cy="285" r="10"/>
  </g>
  <g fill="#22d3ee" fill-opacity="0.25" stroke="#22d3ee" stroke-width="1">
    <rect x="850" y="172" width="100" height="12"/>
    <rect x="1000" y="172" width="100" height="12"/>
  </g>
  <text x="975" y="322" font-size="9" fill="#22d3ee" fill-opacity="0.7" text-anchor="middle">ATO · TARGETING · WEAPON PAIRING</text>

  <!-- ===== Inter-workstation data flow ===== -->
  <g stroke="#22d3ee" stroke-width="1" stroke-dasharray="4 3" fill="none" marker-end="url(#arrow)">
    <path d="M380 215H400V116H480"/>
    <path d="M380 245H430V335H520"/>
    <path d="M680 335H770V245H830"/>
    <path d="M830 215H800V116H720"/>
  </g>

  <!-- ===== Legend ===== -->
  <g font-size="9" fill="#22d3ee">
    <rect x="30" y="648" width="22" height="12" fill="none" stroke="#22d3ee" stroke-width="1"/>
    <text x="60" y="658">WORKSTATION</text>

    <rect x="165" y="648" width="22" height="12" fill="#22d3ee" fill-opacity="0.25" stroke="#22d3ee" stroke-width="1"/>
    <text x="195" y="658">DISPLAY</text>

    <rect x="275" y="648" width="22" height="12" fill="none" stroke="#22d3ee" stroke-width="1" stroke-dasharray="4 3"/>
    <text x="305" y="658">SECURE ZONE</text>

    <path d="M410 654H432" stroke="#22d3ee" stroke-width="1" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
    <text x="442" y="658">DATA FLOW</text>
  </g>

  <text x="1170" y="688" font-size="9" fill="#22d3ee" fill-opacity="0.5" text-anchor="end">AIR COMMAND · COMMAND POST SCHEMATIC · NOT TO SCALE</text>
</svg>
