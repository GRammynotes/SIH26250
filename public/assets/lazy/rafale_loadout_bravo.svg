    <text x="270" y="364" text-anchor="end">QTY</text>
    <text x="310" y="364">STATIONS</text>
    <text x="600" y="364" text-anchor="end">UNIT KG</text>
    <text x="764" y="364" text-anchor="end">SUBTOTAL KG</text>
  </g>
  <path d="M36 369H764M36 441H764" stroke="#00d4ff" stroke-opacity="0.3" stroke-width="1"/>

  <g fill="#ffb000">
    <rect x="36" y="376" width="4" height="4"/>
    <rect x="36" y="389" width="4" height="4"/>
    <rect x="36" y="402" width="4" height="4"/>
    <rect x="36" y="415" width="4" height="4"/>
    <rect x="36" y="428" width="4" height="4"/>
  </g>
  <g font-size="9" fill="#00d4ff">
    <text x="46" y="382">METEOR</text>
    <text x="270" y="382" text-anchor="end">2</text>
    <text x="310" y="382">05 · 10</text>
    <text x="600" y="382" text-anchor="end">190</text>
    <text x="764" y="382" text-anchor="end">380</text>

    <text x="46" y="395">MICA RF</text>
    <text x="270" y="395" text-anchor="end">2</text>
    <text x="310" y="395">03 · 12</text>
    <text x="600" y="395" text-anchor="end">112</text>
    <text x="764" y="395" text-anchor="end">224</text>

    <text x="46" y="408">MICA IR</text>
    <text x="270" y="408" text-anchor="end">2</text>
    <text x="310" y="408">01 · 14</text>
    <text x="600" y="408" text-anchor="end">112</text>
    <text x="764" y="408" text-anchor="end">224</text>

    <text x="46" y="421">SCALP</text>
    <text x="270" y="421" text-anchor="end">1</text>
    <text x="310" y="421">07</text>
    <text x="600" y="421" text-anchor="end">1,300</text>
    <text x="764" y="421" text-anchor="end">1,300</text>

    <text x="46" y="434">HAMMER</text>
    <text x="270" y="434" text-anchor="end">2</text>
    <text x="310" y="434">02 · 13</text>
    <text x="600" y="434" text-anchor="end">340</text>
    <text x="764" y="434" text-anchor="end">680</text>

    <text x="46" y="455">TOTAL EXTERNAL PAYLOAD</text>
  </g>
  <text x="310" y="455" font-size="9" fill="#00d4ff" fill-opacity="0.6">29.6% OF 9,500 KG MAX</text>
  <text x="764" y="456" font-size="11" text-anchor="end" fill="#ffb000">2,808 KG</text>

  <!-- Payload bar -->
  <rect x="36" y="463" width="728" height="5" fill="none" stroke="#00d4ff" stroke-opacity="0.6" stroke-width="1"/>
  <rect x="36" y="463" width="215" height="5" fill="#ffb000"/>
  <text x="36" y="479" font-size="7" fill="#00d4ff" fill-opacity="0.6">ILLUSTRATIVE LOADOUT · APPROX. WEIGHTS</text>
  <text x="764" y="479" font-size="7" text-anchor="end" fill="#00d4ff" fill-opacity="0.6">MAX 9,500 KG</text>
</svg>
