      <circle cx="248" cy="281" r="5"/>
      <circle cx="284" cy="269" r="5"/>
      <circle cx="348" cy="250" r="5"/>
      <circle cx="400" cy="232" r="5"/>
      <circle cx="452" cy="250" r="5"/>
      <circle cx="516" cy="269" r="5"/>
      <circle cx="552" cy="281" r="5"/>
      <circle cx="586" cy="292" r="5"/>
    </g>

    <!-- Empty station numbers -->
    <g font-size="7" text-anchor="middle" fill="#64748b">
      <text x="318" y="271">ST04</text>
      <text x="372" y="217">ST06</text>
      <text x="400" y="305">ST08</text>
      <text x="428" y="217">ST09</text>
      <text x="482" y="271">ST11</text>
    </g>

    <!-- Weapon labels: left column -->
    <g font-size="9" fill="#ffb000" text-anchor="end">
      <text x="186" y="215">METEOR</text>
      <text x="186" y="241">MICA RF</text>
      <text x="186" y="267">HAMMER</text>
      <text x="186" y="295">MICA IR</text>
    </g>
    <g font-size="7" fill="#64748b" text-anchor="end">
      <text x="186" y="224">ST05</text>
      <text x="186" y="250">ST03</text>
      <text x="186" y="276">ST02</text>
      <text x="186" y="304">ST01</text>
    </g>

    <!-- Weapon labels: right column -->
    <g font-size="9" fill="#ffb000">
      <text x="614" y="177">SCALP</text>
      <text x="614" y="215">METEOR</text>
      <text x="614" y="241">MICA RF</text>
      <text x="614" y="267">HAMMER</text>
      <text x="614" y="295">MICA IR</text>
    </g>
    <g font-size="7" fill="#64748b">
      <text x="614" y="186">ST07</text>
      <text x="614" y="224">ST10</text>
      <text x="614" y="250">ST12</text>
      <text x="614" y="276">ST13</text>
      <text x="614" y="304">ST14</text>
    </g>
