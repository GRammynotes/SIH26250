<g class="ld"><circle cx="250" cy="256" r="8"/><circle cx="295" cy="245" r="8"/><circle cx="345" cy="233" r="8"/><circle cx="455" cy="233" r="8"/><circle cx="505" cy="245" r="8"/><circle cx="550" cy="256" r="8"/></g>
