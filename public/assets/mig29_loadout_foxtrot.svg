<rect class="ac" x="382" y="262" width="4" height="46"/>
<ellipse cx="400" cy="96" rx="3.5" ry="11" fill="none" stroke="#00d4ff" stroke-opacity=".5"/>

<!-- leader lines -->
<path class="ll" d="M242,256H194M288,242L194,212M338,229L194,162M558,256H606M512,242L606,212M462,229L606,162"/>

